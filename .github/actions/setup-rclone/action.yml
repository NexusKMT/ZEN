name: Set up pinned rclone
description: Install a checksum-pinned rclone release for private checkpoint transfers.

inputs:
  version:
    description: Exact rclone semantic version.
    required: true
  bundle-sha256:
    description: SHA-256 of the official Linux AMD64 release ZIP.
    required: true
  osx-amd64-bundle-sha256:
    description: SHA-256 of the official macOS Intel release ZIP.
    required: false
    default: ""
  osx-arm64-bundle-sha256:
    description: SHA-256 of the official macOS Apple Silicon release ZIP.
    required: false
    default: ""

outputs:
  rclone-bin:
    description: Absolute path to the verified rclone binary.
    value: ${{ steps.install.outputs.rclone-bin }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        RCLONE_RELEASE_INPUT: ${{ inputs.version }}
        RCLONE_BUNDLE_SHA256_INPUT: ${{ inputs.bundle-sha256 }}
        RCLONE_OSX_AMD64_BUNDLE_SHA256_INPUT: ${{ inputs.osx-amd64-bundle-sha256 }}
        RCLONE_OSX_ARM64_BUNDLE_SHA256_INPUT: ${{ inputs.osx-arm64-bundle-sha256 }}
      run: bash "$GITHUB_ACTION_PATH/../../scripts/install-rclone.sh"
