name: UE 5.5.4 iOS A8/A9 IPA merge from reusable app

on:
  workflow_dispatch:
    inputs:
      app_transfer_key:
        description: Private checkpoint key produced by the unsigned app workflow
        required: true
        type: string
      app_transfer_stage:
        description: Private checkpoint stage for the unsigned app
        required: true
        default: ios-app
        type: string
      expected_producer_commit:
        description: Optional producer commit to bind the downloaded app checkpoint to
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ue5-ios-a8a9-package
  cancel-in-progress: false

env:
  RCLONE_RELEASE: "1.75.0"
  RCLONE_BUNDLE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
  RCLONE_OSX_AMD64_BUNDLE_SHA256: 19edbb8e5e73096eb66e92a42abbc5c34bfa8981ea3986a53872c7eef85a22f4
  EXPECTED_HOST_ARCH: x86_64
  EXPECTED_RUNNER_ARCH: X64
  EXPECTED_PRODUCER_XCODE_VERSION: "16.4"
  EXPECTED_PRODUCER_XCODE_BUILD: 16F6
  EXPECTED_PRODUCER_IPHONEOS_SDK: "18.5"
  UE5_VERSION: "5.5.4"

jobs:
  merge:
    name: Download app and merge final unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out the public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify the hosted Intel merge environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "${RUNNER_ARCH:-}" = "$EXPECTED_RUNNER_ARCH"
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test -x /usr/libexec/PlistBuddy
          for merge_tool in /usr/bin/codesign /usr/bin/ditto /usr/bin/lipo; do
            test -x "$merge_tool"
          done
          command -v shasum >/dev/null
          command -v tar >/dev/null
          command -v unzip >/dev/null

      - name: Install pinned rclone
        uses: ./.github/actions/setup-rclone
        with:
          version: ${{ env.RCLONE_RELEASE }}
          bundle-sha256: ${{ env.RCLONE_BUNDLE_SHA256 }}
          osx-amd64-bundle-sha256: ${{ env.RCLONE_OSX_AMD64_BUNDLE_SHA256 }}

      - name: Download and verify the reusable unsigned app
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          EXPECTED_UE5_VERSION: ${{ env.UE5_VERSION }}
          EXPECTED_PRODUCER_COMMIT: ${{ inputs.expected_producer_commit }}
          EXPECTED_PRODUCER_HOST_ARCH: ${{ env.EXPECTED_HOST_ARCH }}
          EXPECTED_CONSUMER_HOST_ARCH: ${{ env.EXPECTED_HOST_ARCH }}
          EXPECTED_PRODUCER_XCODE_VERSION: ${{ env.EXPECTED_PRODUCER_XCODE_VERSION }}
          EXPECTED_PRODUCER_XCODE_BUILD: ${{ env.EXPECTED_PRODUCER_XCODE_BUILD }}
          EXPECTED_PRODUCER_IPHONEOS_SDK: ${{ env.EXPECTED_PRODUCER_IPHONEOS_SDK }}
          APP_TRANSFER_STAGE: ${{ inputs.app_transfer_stage }}
          APP_TRANSFER_KEY: ${{ inputs.app_transfer_key }}
        run: |
          set -euo pipefail
          app_dir="$RUNNER_TEMP/ue5-ios-app-transfer"
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone-private-ios-app-transfer.sh" \
            download "$app_dir" "$APP_TRANSFER_STAGE" "$APP_TRANSFER_KEY"

      - name: Merge the app into the final unsigned IPA
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ue5-ios-merge-ipa.sh"

      - name: Upload and byte-verify the final unsigned IPA
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          SOURCE_TRANSFER_KEY: ${{ inputs.app_transfer_key }}
        run: |
          set -euo pipefail
          output_key="${SOURCE_TRANSFER_KEY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone-private-package-upload.sh" \
            "${UNSIGNED_IPA_PATH%/*}" ios-unsigned "$output_key"

      - name: Upload sanitized consumer audits
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ue5-ios-a8a9-merge-audit
          path: |
            ${{ runner.temp }}/ue5-ios-app-private-transfer.txt
            ${{ runner.temp }}/ue5-ios-a8a9-merge-manifest.txt
            ${{ runner.temp }}/ue5-ios-private-upload.txt
          if-no-files-found: warn
          retention-days: 7
