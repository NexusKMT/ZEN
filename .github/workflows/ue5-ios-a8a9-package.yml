name: UE 5.5.4 iOS A8/A9 package

on:
  workflow_dispatch:
    inputs:
      ue427_transfer_key:
        description: Clean UE 4.27 transfer key reported by a completed producer stage
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ue5-ios-a8a9-package
  cancel-in-progress: false

env:
  PROJECT_ROOT_NAME: EpicZenGarden
  RCLONE_RELEASE: "1.75.0"
  RCLONE_BUNDLE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
  UE5_VERSION: "5.5.4"
  UE5_ROOT: ${{ vars.UE5_55_ENGINE_ROOT }}
  UE427_TRANSFER_STAGE: ue427-clean

jobs:
  package:
    name: Download, validate, and package iOS
    runs-on: [self-hosted, macOS, ue5.5.4]
    timeout-minutes: 360

    steps:
      - name: Check out the public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify Xcode and iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang

      - name: Install pinned rclone
        uses: ./.github/actions/setup-rclone
        with:
          version: ${{ env.RCLONE_RELEASE }}
          bundle-sha256: ${{ env.RCLONE_BUNDLE_SHA256 }}

      - name: Download the clean UE 4.27 project
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          TRANSFER_KEY: ${{ inputs.ue427_transfer_key }}
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/ue427-rclone/$PROJECT_ROOT_NAME"
          test ! -e "$project_dir"
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone-project-transfer.sh" download \
            "$project_dir" "$UE427_TRANSFER_STAGE" "$TRANSFER_KEY"
          test -f "$project_dir/EpicZenGarden.uproject"
          test -f "$project_dir/Content/Maps/Zen_Movie.umap"
          test -f "$project_dir/Content/Maps/Zen_P.umap"
          test -f "$project_dir/Content/Maps/MatineeActor_MovieLevelSequence.uasset"
          test -f "$project_dir/Content/Maps/MatineeActorLevelSequence.uasset"
          test -f "$project_dir/Content/Maps/MatineeActor3LevelSequence.uasset"
          printf 'UE427_PROJECT_DIR=%s\n' "$project_dir" >> "$GITHUB_ENV"

      - name: Apply and audit the UE5.5.4 A8/A9 profile
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apply-ue5-ios-a8a9-config.sh" "$UE427_PROJECT_DIR"

      - name: Build the iOS arm64 IPA
        shell: bash
        env:
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ue5-ios-package.sh"

      - name: Upload iOS text audit only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ue5-ios-a8a9-package-audit
          path: |
            ${{ runner.temp }}/ue5-ios-a8a9-uat.log
            ${{ runner.temp }}/ue5-ios-a8a9-manifest.txt
          if-no-files-found: warn
          retention-days: 7
