name: UE 5.5.4 iOS A8/A9 unsigned app producer

on:
  workflow_dispatch:
    inputs:
      ue427_transfer_key:
        description: Clean UE 4.27 transfer key used by the producer
        required: true
        type: string
        default: 62f39841ebf78ba3-bdf677196afb-31674392278-1
      app_transfer_key:
        description: Immutable private checkpoint key for the unsigned .app
        required: true
        type: string
      reclaim_xcode_space:
        description: Remove unused versioned Xcode applications from the ephemeral runner
        required: true
        type: boolean
        default: true
      reclaim_runner_space:
        description: Remove audited simulator, Android, toolcache, and browser directories
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ue5-ios-app-producer
  cancel-in-progress: false

env:
  UE5_VERSION: "5.5.4"
  UE5_SOURCE_SHA: 2d53fcab0066b1f16dd956b227720841cad0f6f7
  UE5_ROOT: ${{ github.workspace }}/ue5-source/Engine
  SETUP_EXCLUDES: Android,Linux,LinuxArm64,Win32,Win64,HoloLens,TVOS
  EXPECTED_HOST_ARCH: x86_64
  EXPECTED_RUNNER_ARCH: X64
  EXPECTED_MACOS_MAJOR: "15"
  EXPECTED_XCODE_VERSION: "16.4"
  EXPECTED_XCODE_BUILD: 16F6
  EXPECTED_IPHONEOS_SDK: "18.5"
  XCODE_APP: /Applications/Xcode_16.4.app
  PROJECT_ROOT_NAME: EpicZenGarden
  UE427_TRANSFER_STAGE: ue427-clean
  IOS_APP_TRANSFER_STAGE: ios-app
  ENGINE_CHECKPOINT_STAGE: ue5-macos-prepared
  RCLONE_RELEASE: "1.75.0"
  RCLONE_BUNDLE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
  RCLONE_OSX_AMD64_BUNDLE_SHA256: 19edbb8e5e73096eb66e92a42abbc5c34bfa8981ea3986a53872c7eef85a22f4

jobs:
  produce:
    name: Build and upload reusable unsigned iOS app
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Check out the public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Revalidate hosted macOS prerequisites
        shell: bash
        env:
          EPIC_SOURCE_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PROBE_GHCR_IMAGE: false
          RECLAIM_XCODE_SPACE: ${{ inputs.reclaim_xcode_space }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ue5-macos-hosted-probe.sh"

      - name: Reclaim audited non-target runner space
        if: ${{ inputs.reclaim_runner_space }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ue5-macos-runner-space-reclaim.sh"

      - name: Compute the immutable Engine checkpoint key
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ue5-macos-engine-checkpoint-key.sh"

      - name: Install pinned rclone
        uses: ./.github/actions/setup-rclone
        with:
          version: ${{ env.RCLONE_RELEASE }}
          bundle-sha256: ${{ env.RCLONE_BUNDLE_SHA256 }}
          osx-amd64-bundle-sha256: ${{ env.RCLONE_OSX_AMD64_BUNDLE_SHA256 }}

      - name: Download, verify, and smoke-test the prepared Engine
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone-private-ue5-engine-transfer.sh" \
            download "$GITHUB_WORKSPACE/ue5-source" "$ENGINE_CHECKPOINT_STAGE" "$ENGINE_CHECKPOINT_KEY"

      - name: Download the clean UE 4.27 project
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          TRANSFER_KEY: ${{ inputs.ue427_transfer_key }}
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/ue427-rclone/$PROJECT_ROOT_NAME"
          test ! -e "$project_dir"
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone-project-transfer.sh" download \
            "$project_dir" "$UE427_TRANSFER_STAGE" "$TRANSFER_KEY"
          test -f "$project_dir/EpicZenGarden.uproject"
          test -f "$project_dir/Content/Maps/Zen_Movie.umap"
          test -f "$project_dir/Content/Maps/Zen_P.umap"
          test -f "$project_dir/Content/Maps/MatineeActor_MovieLevelSequence.uasset"
          test -f "$project_dir/Content/Maps/MatineeActorLevelSequence.uasset"
          test -f "$project_dir/Content/Maps/MatineeActor3LevelSequence.uasset"
          printf 'UE427_PROJECT_DIR=%s\n' "$project_dir" >> "$GITHUB_ENV"

      - name: Build and validate the unsigned iOS app only
        shell: bash
        env:
          IOS_APP_ONLY: true
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ue5-ios-package.sh"

      - name: Upload and byte-verify the reusable unsigned app
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          IOS_APP_MANIFEST: ${{ runner.temp }}/ue5-ios-a8a9-app-manifest.txt
          EXPECTED_UE5_VERSION: ${{ env.UE5_VERSION }}
          EXPECTED_PRODUCER_HOST_ARCH: ${{ env.EXPECTED_HOST_ARCH }}
          EXPECTED_PRODUCER_XCODE_VERSION: ${{ env.EXPECTED_XCODE_VERSION }}
          EXPECTED_PRODUCER_XCODE_BUILD: ${{ env.EXPECTED_XCODE_BUILD }}
          EXPECTED_PRODUCER_IPHONEOS_SDK: ${{ env.EXPECTED_IPHONEOS_SDK }}
          GITHUB_SHA: ${{ github.sha }}
          APP_TRANSFER_KEY: ${{ inputs.app_transfer_key }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/rclone-private-ios-app-transfer.sh" \
            upload "$IOS_APP_DIR" "$IOS_APP_TRANSFER_STAGE" "$APP_TRANSFER_KEY"

      - name: Upload sanitized producer audits
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ue5-ios-app-producer-audit
          path: |
            ${{ runner.temp }}/ue5-macos-hosted-probe.txt
            ${{ runner.temp }}/ue5-macos-runner-space-reclaim.txt
            ${{ runner.temp }}/ue5-macos-engine-checkpoint-transfer.txt
            ${{ runner.temp }}/ue5-ios-a8a9-uat.log
            ${{ runner.temp }}/ue5-ios-a8a9-app-manifest.txt
            ${{ runner.temp }}/ue5-ios-app-private-transfer.txt
          if-no-files-found: warn
          retention-days: 7
