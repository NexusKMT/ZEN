name: UE 4.27 to 5.5.4 migration probe

on:
  workflow_dispatch:
    inputs:
      run_ue427_bridge:
        description: Convert the Zen_Movie Matinee with the licensed Epic UE 4.27.2 image
        required: true
        type: boolean
        default: false
      run_ue_container:
        description: Probe UE 5.5.4 against the completed UE 4.27 bridge output
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ue55-asset-probe
  cancel-in-progress: false

env:
  ARCHIVE_NAME: EpicZenGarden-clean-project-20260807.zip
  ARCHIVE_BYTES: "2171159058"
  ARCHIVE_SHA256: 62f39841ebf78ba3e56d67fb25789af9e43d7feccd1705eea326634a6dccf2d2
  ARCHIVE_QUICKXOR: 164b5e3643c008b994ab85599f5184709cfe2c52
  EXTRACTED_FILES: "960"
  EXTRACTED_BYTES: "2255274451"
  PROJECT_ROOT_NAME: EpicZenGarden
  RCLONE_RELEASE: "1.75.0"
  RCLONE_BUNDLE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
  UE427_IMAGE: ghcr.io/epicgames/unreal-engine:dev-4.27
  UE55_IMAGE: ghcr.io/epicgames/unreal-engine:dev-5.5.4

jobs:
  probe:
    name: Retrieve, verify, and inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out the public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Enforce the migration order
        if: ${{ inputs.run_ue_container && !inputs.run_ue427_bridge }}
        shell: bash
        run: |
          echo '::error::UE 5.5.4 validation requires run_ue427_bridge=true; direct UE 4.23 to UE 5.5.4 is forbidden.'
          exit 1

      - name: Report initial runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -hT / "$RUNNER_TEMP"

      - name: Reclaim preinstalled runner space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: true

      - name: Report reclaimed runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -hT / "$RUNNER_TEMP"
          docker system df

      - name: Install pinned rclone
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="$RUNNER_TEMP/rclone-tool"
          bundle="$tool_dir/rclone.zip"
          mkdir -p "$tool_dir"

          curl --fail --location --silent --show-error --retry 5 \
            --output "$bundle" \
            "https://downloads.rclone.org/v${RCLONE_RELEASE}/rclone-v${RCLONE_RELEASE}-linux-amd64.zip"
          printf '%s  %s\n' "$RCLONE_BUNDLE_SHA256" "$bundle" | sha256sum --check --status
          unzip -q "$bundle" -d "$tool_dir"

          rclone_bin="$(find "$tool_dir" -type f -name rclone -print -quit)"
          test -n "$rclone_bin"
          chmod 0755 "$rclone_bin"
          version_line="$("$rclone_bin" version | sed -n '1p')"
          test "$version_line" = "rclone v${RCLONE_RELEASE}"

          printf 'RCLONE_BIN=%s\n' "$rclone_bin" >> "$GITHUB_ENV"
          printf 'Installed %s\n' "$version_line"

      - name: Retrieve and verify the cloud archive
        shell: bash
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail

          config_dir="$RUNNER_TEMP/rclone-config"
          config_file="$config_dir/rclone.conf"
          download_dir="$RUNNER_TEMP/zen-download"
          transfer_log="$RUNNER_TEMP/rclone-transfer.log"

          cleanup_config() {
            if test -f "$config_file"; then
              shred --remove "$config_file" 2>/dev/null || rm -f "$config_file"
            fi
          }
          trap cleanup_config EXIT

          test -n "$RCLONE_CONFIG_CONTENT" || {
            echo '::error::Repository secret RCLONE_CONFIG is empty or unavailable.'
            exit 1
          }

          umask 077
          mkdir -p "$config_dir" "$download_dir"
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$config_file"

          remote_count="$("$RCLONE_BIN" listremotes --config "$config_file" | awk 'NF { count++ } END { print count + 0 }')"
          test "$remote_count" = 1 || {
            echo "::error::RCLONE_CONFIG must define exactly one remote; found ${remote_count}."
            exit 1
          }

          remote_name="$("$RCLONE_BIN" listremotes --config "$config_file")"
          remote_name="${remote_name//$'\r'/}"
          remote_name="${remote_name//$'\n'/}"
          test -n "$remote_name"
          cloud_root="${remote_name}ZEN"

          download_one() {
            local filename="$1"
            if ! "$RCLONE_BIN" copyto \
              --config "$config_file" \
              --retries 3 \
              --low-level-retries 10 \
              --stats 30s \
              --log-file "$transfer_log" \
              "${cloud_root}/${filename}" \
              "${download_dir}/${filename}"
            then
              echo "::error::rclone failed while retrieving ${filename}; the remote name is intentionally suppressed."
              exit 1
            fi
          }

          download_one "$ARCHIVE_NAME"
          download_one "${ARCHIVE_NAME}.sha256"
          download_one archive-metadata.txt

          archive_path="$download_dir/$ARCHIVE_NAME"
          actual_bytes="$(stat --format='%s' "$archive_path")"
          test "$actual_bytes" = "$ARCHIVE_BYTES" || {
            echo "::error::Archive length mismatch: expected ${ARCHIVE_BYTES}, got ${actual_bytes}."
            exit 1
          }

          if ! remote_quickxor="$(
            "$RCLONE_BIN" hashsum QuickXorHash \
              --config "$config_file" \
              "${cloud_root}/${ARCHIVE_NAME}" 2>> "$transfer_log" |
              awk 'NR == 1 { print tolower($1) }'
          )"
          then
            echo '::error::Could not read the server-side QuickXorHash; the remote name is intentionally suppressed.'
            exit 1
          fi
          local_quickxor="$(
            "$RCLONE_BIN" hashsum QuickXorHash "$archive_path" |
              awk 'NR == 1 { print tolower($1) }'
          )"
          test "$remote_quickxor" = "$ARCHIVE_QUICKXOR" || {
            echo '::error::The OneDrive server-side QuickXorHash does not match the pinned archive.'
            exit 1
          }
          test "$local_quickxor" = "$remote_quickxor" || {
            echo '::error::The downloaded archive does not match the OneDrive QuickXorHash.'
            exit 1
          }

          sidecar_path="${archive_path}.sha256"
          sidecar_sha256="$(awk 'NR == 1 { print tolower($1) } END { if (NR != 1) exit 1 }' "$sidecar_path")"
          [[ "$sidecar_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$sidecar_sha256" = "$ARCHIVE_SHA256" || {
            echo '::error::The cloud SHA-256 sidecar does not contain the pinned digest.'
            exit 1
          }

          actual_sha256="$(sha256sum "$archive_path" | awk '{ print tolower($1) }')"
          test "$actual_sha256" = "$sidecar_sha256" || {
            echo '::error::The downloaded archive failed SHA-256 verification.'
            exit 1
          }

          printf 'Verified %s (%s bytes).\n' "$ARCHIVE_NAME" "$actual_bytes"
          printf 'QuickXorHash: %s\nSHA-256: %s\n' "$local_quickxor" "$actual_sha256"

          printf 'DOWNLOAD_DIR=%s\n' "$download_dir" >> "$GITHUB_ENV"

      - name: Validate and extract the project
        shell: bash
        run: |
          set -euo pipefail

          archive_path="$DOWNLOAD_DIR/$ARCHIVE_NAME"
          extract_dir="$RUNNER_TEMP/zen-project"
          entry_list="$RUNNER_TEMP/zen-archive-entries.txt"
          mkdir -p "$extract_dir"

          zipinfo -1 "$archive_path" > "$entry_list"
          test -s "$entry_list"

          if ! awk -v root="${PROJECT_ROOT_NAME}/" '
            index($0, root) != 1 { exit 1 }
            $0 ~ /(^|\/)\.\.(\/|$)/ { exit 1 }
            $0 ~ /^\// { exit 1 }
            index($0, "\\") != 0 { exit 1 }
          ' "$entry_list"
          then
            echo '::error::The ZIP contains a path outside the expected EpicZenGarden root.'
            exit 1
          fi

          if ! zipinfo -l "$archive_path" | awk '$1 ~ /^l/ { found = 1 } END { exit found }'
          then
            echo '::error::The ZIP contains a symbolic-link entry.'
            exit 1
          fi

          unzip -q "$archive_path" -d "$extract_dir"
          project_dir="$extract_dir/$PROJECT_ROOT_NAME"

          test -d "$project_dir/Build"
          test -d "$project_dir/Config"
          test -d "$project_dir/Content"
          test -f "$project_dir/EpicZenGarden.uproject"

          mapfile -d '' project_files < <(find "$extract_dir" -type f -name '*.uproject' -print0)
          test "${#project_files[@]}" = 1
          test "${project_files[0]}" = "$project_dir/EpicZenGarden.uproject"

          if find "$extract_dir" -type l -print -quit | grep -q .; then
            echo '::error::The extracted project contains a symbolic link.'
            exit 1
          fi

          actual_files="$(find "$project_dir" -type f -printf '\n' | wc -l | tr -d ' ')"
          actual_bytes="$(find "$project_dir" -type f -printf '%s\n' | awk '{ total += $1 } END { printf "%.0f", total }')"
          test "$actual_files" = "$EXTRACTED_FILES" || {
            echo "::error::Extracted file count mismatch: expected ${EXTRACTED_FILES}, got ${actual_files}."
            exit 1
          }
          test "$actual_bytes" = "$EXTRACTED_BYTES" || {
            echo "::error::Extracted byte count mismatch: expected ${EXTRACTED_BYTES}, got ${actual_bytes}."
            exit 1
          }

          printf 'PROJECT_DIR=%s\n' "$project_dir" >> "$GITHUB_ENV"
          printf 'Extracted %s files (%s logical bytes).\n' "$actual_files" "$actual_bytes"
          du -sh "$project_dir"
          df -hT / "$RUNNER_TEMP"

          {
            echo '## Zen Garden asset verification'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| Archive bytes | `%s` |\n' "$ARCHIVE_BYTES"
            printf '| QuickXorHash | `%s` |\n' "$ARCHIVE_QUICKXOR"
            printf '| SHA-256 | `%s` |\n' "$ARCHIVE_SHA256"
            printf '| Extracted files | `%s` |\n' "$actual_files"
            printf '| Extracted logical bytes | `%s` |\n' "$actual_bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull the licensed Epic engine images
        if: ${{ inputs.run_ue427_bridge }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$GHCR_TOKEN" || {
            echo '::error::Engine stages require GHCR_TOKEN with read:packages and Epic Unreal Engine access.'
            exit 1
          }

          cleanup_login() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup_login EXIT

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin
          bash "$GITHUB_WORKSPACE/.github/scripts/pull-ghcr-image.sh" "$UE427_IMAGE"
          docker image inspect "$UE427_IMAGE" --format 'UE 4.27 image ID: {{.Id}} | Size: {{.Size}} bytes'
          docker run --rm "$UE427_IMAGE" id

          build_version="$(docker run --rm --entrypoint /bin/cat "$UE427_IMAGE" \
            /home/ue4/UnrealEngine/Engine/Build/Build.version)"
          printf '%s\n' "$build_version" | jq --exit-status '
            .MajorVersion == 4 and
            .MinorVersion == 27 and
            .PatchVersion == 2
          ' >/dev/null || {
            echo '::error::Epic dev-4.27 did not contain the required UE 4.27.2 engine.'
            printf '%s\n' "$build_version"
            exit 1
          }
          echo 'Verified Epic image engine version: 4.27.2'
          df -hT / "$RUNNER_TEMP"

      - name: Create the writable UE 4.27 bridge copy
        if: ${{ inputs.run_ue427_bridge }}
        shell: bash
        run: |
          set -euo pipefail

          bridge_root="$RUNNER_TEMP/ue427-bridge"
          bridge_project="$bridge_root/$PROJECT_ROOT_NAME"
          mkdir -p "$bridge_project"

          # DDC is verified as part of the source archive but is deliberately
          # excluded from the writable migration copy so 4.27 rebuilds it.
          tar --directory "$PROJECT_DIR" \
            --exclude='./DerivedDataCache' \
            --create --file=- . |
            tar --directory "$bridge_project" --extract --file=-
          chmod -R a+rwX "$bridge_project"

          test -f "$bridge_project/EpicZenGarden.uproject"
          test -d "$bridge_project/Content"
          if test -e "$bridge_project/DerivedDataCache"; then
            echo '::error::The UE 4.27 bridge copy unexpectedly contains the UE 4.23 DDC.'
            exit 1
          fi

          printf 'UE427_PROJECT_DIR=%s\n' "$bridge_project" >> "$GITHUB_ENV"
          printf 'Created writable bridge copy at %s.\n' "$bridge_project"
          du -sh "$bridge_project"
          df -hT / "$RUNNER_TEMP"

      - name: Build and install the UE 4.27 Matinee bridge
        if: ${{ inputs.run_ue427_bridge }}
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/zen-matinee-bridge-package"
          project_plugin_dir="$UE427_PROJECT_DIR/Plugins/ZenMatineeBridge"
          mkdir -p "$package_dir"
          chmod 0777 "$package_dir"

          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace/harness,readonly" \
            --mount "type=bind,src=${package_dir},dst=/workspace/package" \
            "$UE427_IMAGE" \
            bash -lc '
              set -euo pipefail
              /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh BuildPlugin \
                -Plugin=/workspace/harness/automation/ue427/ZenMatineeBridge/ZenMatineeBridge.uplugin \
                -Package=/workspace/package \
                -NoTargetPlatforms
            '

          test -f "$package_dir/ZenMatineeBridge.uplugin"
          # BuildPlugin rewrites the descriptor for binary distribution. This
          # is a project plugin, so restore the reviewed descriptor that keeps
          # it enabled while the bridge commandlet is in use.
          cp -f \
            "$GITHUB_WORKSPACE/automation/ue427/ZenMatineeBridge/ZenMatineeBridge.uplugin" \
            "$package_dir/ZenMatineeBridge.uplugin"
          mkdir -p "$project_plugin_dir"
          cp -R "$package_dir/." "$project_plugin_dir/"
          test -d "$project_plugin_dir/Binaries/Linux"
          test -f "$project_plugin_dir/ZenMatineeBridge.uplugin"
          echo 'Installed the compiled bridge into the writable UE 4.27 project copy.'

      - name: Convert Matinee and resave with UE 4.27.2
        if: ${{ inputs.run_ue427_bridge }}
        shell: bash
        run: |
          set -euo pipefail

          log_dir="$RUNNER_TEMP/ue427-logs"
          mkdir -p "$log_dir"
          chmod 0777 "$log_dir"

          docker run --rm \
            --mount "type=bind,src=${UE427_PROJECT_DIR},dst=/workspace/EpicZenGarden" \
            --mount "type=bind,src=${log_dir},dst=/workspace/logs" \
            "$UE427_IMAGE" \
            bash -lc '
              set -euo pipefail
              editor=/home/ue4/UnrealEngine/Engine/Binaries/Linux/UE4Editor-Cmd
              project=/workspace/EpicZenGarden/EpicZenGarden.uproject

              "$editor" "$project" \
                -run=ZenMatineeBridge \
                -TargetMap=/Game/Maps/Zen_Movie \
                -ExpectedActor=MatineeActor_Movie \
                -ExpectedMatinees=1 \
                -unattended -nop4 -nosplash -NullRHI -NoSound \
                -stdout -FullStdOutLogOutput -UTF8Output |
                tee /workspace/logs/matinee-conversion.log

              set +e
              "$editor" "$project" \
                -run=ResavePackages \
                -ProjectOnly -IgnoreChangelist \
                -unattended -nop4 -NullRHI -NoSound \
                -stdout -FullStdOutLogOutput -UTF8Output |
                tee /workspace/logs/resave-packages.log
              resave_pipeline_status=("${PIPESTATUS[@]}")
              set -e

              resave_status="${resave_pipeline_status[0]}"
              tee_status="${resave_pipeline_status[1]}"
              echo "UE4Editor-Cmd ResavePackages process status: $resave_status"
              if [[ "$tee_status" != 0 ]]; then
                echo "Failed to capture the ResavePackages log (tee status $tee_status)." >&2
                exit "$tee_status"
              fi
              if [[ "$resave_status" != 0 ]]; then
                echo "ResavePackages failed with process status $resave_status." >&2
                exit "$resave_status"
              fi

              required_resave_lines=(
                "[REPORT] 918/918 packages were considered for resaving"
                "[REPORT] 918/918 packages were resaved"
                "Commandlet ResavePackagesCommandlet_0 finished execution (result 0)"
                "Success - 0 error(s), 0 warning(s)"
                "LogExit: Exiting."
              )
              for required_line in "${required_resave_lines[@]}"; do
                if ! grep -Fq -- "$required_line" /workspace/logs/resave-packages.log; then
                  echo "ResavePackages log is missing required success evidence: $required_line" >&2
                  exit 21
                fi
              done

              if grep -Eiq "Exiting abnormally|Fatal error|Critical error" \
                /workspace/logs/resave-packages.log; then
                echo "ResavePackages log contains an abnormal or fatal exit marker." >&2
                exit 22
              fi
            '

          report="$UE427_PROJECT_DIR/Saved/ZenMigration/ue427-bridge-report.json"
          test -f "$report"
          jq . "$report"
          jq --exit-status \
            --arg known_warning "Unsupported track 'Fade'." '
            def actor($map; $name):
              first(.matineeInventory[] | select(.map == $map and .actor == $name));
            def valid_reference_contexts:
              (.referenceContexts | length) >= 1 and
              all(.referenceContexts[];
                .referencerCount >= 1 and
                .referencerCount == (.referencers | length) and
                all(.referencers[];
                  (.class | type) == "string" and
                  (.objectPath | type) == "string" and
                  (.package | type) == "string" and
                  .insideSourceActor == false
                )
              );
            def unique_blueprint_nodes($class):
              [
                .matineeInventory[].referenceContexts[].referencers[] |
                select(.class == $class) |
                .blueprintNode
              ] |
              unique_by(.objectPath);
            .engineVersion == "4.27.2" and
            .targetMap == "/Game/Maps/Zen_Movie" and
            .expectedActor == "MatineeActor_Movie" and
            .uniqueMatineesDiscovered == 3 and
            (.matineeInventory | length) == 3 and
            .matineesFound == 1 and
            .matineesConverted == 1 and
            .sourceActorsRetained == 1 and
            .sourceActorsRemoved == 0 and
            .conversionWarnings == 1 and
            .knownConversionWarnings == 1 and
            .unexpectedConversionWarnings == 0 and
            .converterWarningMessages == [$known_warning] and
            (.generatedSequences | length) == 1 and
            (actor("/Game/Maps/Zen_Movie"; "MatineeActor_Movie") |
              .playOnLevelLoad == false and
              .looping == false and
              .rewindOnPlay == false and
              .playRate == 1 and
              .sourceTrackClasses == {
                "InterpTrackDirector": 1,
                "InterpTrackEvent": 1,
                "InterpTrackFade": 1,
                "InterpTrackSound": 10,
                "InterpTrackMove": 2,
                "InterpTrackFloatProp": 2,
                "InterpTrackToggle": 5
              } and
              valid_reference_contexts
            ) and
            (actor("/Game/Maps/Zen_P"; "MatineeActor") |
              .playOnLevelLoad == false and
              .looping == true and
              .rewindOnPlay == false and
              .playRate == 1 and
              .sourceTrackClasses == {
                "InterpTrackMove": 2,
                "InterpTrackFloatProp": 2,
                "InterpTrackDirector": 1,
                "InterpTrackFade": 1,
                "InterpTrackToggle": 1,
                "InterpTrackEvent": 1
              } and
              valid_reference_contexts
            ) and
            (actor("/Game/Maps/Zen_P"; "MatineeActor3") |
              .playOnLevelLoad == false and
              .looping == false and
              .rewindOnPlay == false and
              .playRate == 1 and
              .sourceTrackClasses == {
                "InterpTrackMove": 2,
                "InterpTrackFloatProp": 2,
                "InterpTrackEvent": 2,
                "InterpTrackDirector": 1,
                "InterpTrackSound": 6,
                "InterpTrackToggle": 2
              } and
              valid_reference_contexts
            ) and
            all(.matineeInventory[];
              (.forceStartPositionEnabled | type) == "boolean" and
              (.forceStartPosition | type) == "number" and
              (.noResetOnRewind | type) == "boolean" and
              (.rewindIfAlreadyPlaying | type) == "boolean" and
              (.disableRadioFilter | type) == "boolean" and
              (.clientSideOnly | type) == "boolean" and
              (.skipUpdateIfNotVisible | type) == "boolean" and
              (.skippable | type) == "boolean" and
              (.preferredSplitScreenNumber | type) == "number" and
              (.disableMovementInput | type) == "boolean" and
              (.disableLookAtInput | type) == "boolean" and
              (.hidePlayer | type) == "boolean" and
              (.hideHud | type) == "boolean" and
              (.controllerName | type) == "string"
            ) and
            (unique_blueprint_nodes("K2Node_MatineeController") | length) == 3 and
            all(unique_blueprint_nodes("K2Node_MatineeController")[];
              .semantic == "matineeEventController" and
              (.referencedObject | length) > 0 and
              .pinCount == (.pins | length) and
              .pinCount >= 2 and
              all(.pins[];
                .direction == "output" and
                .category == "exec" and
                .linkCount == (.links | length)
              )
            ) and
            (unique_blueprint_nodes("K2Node_Literal") | length) == 7 and
            all(unique_blueprint_nodes("K2Node_Literal")[];
              .semantic == "levelActorLiteral" and
              (.referencedObject | length) > 0 and
              .pinCount == 1 and
              .pins[0].direction == "output" and
              .pins[0].category == "object" and
              .pins[0].linkCount == (.pins[0].links | length) and
              .pins[0].linkCount >= 1
            ) and
            .sourceTrackClasses.InterpTrackDirector > 0 and
            .sourceTrackClasses.InterpTrackFade > 0 and
            .sourceTrackClasses.InterpTrackSound > 0 and
            .sourceTrackClasses.InterpTrackEvent > 0 and
            .sourceTrackClasses.InterpTrackToggle > 0 and
            .sequenceTrackClasses.MovieSceneCameraCutTrack > 0 and
            .sequenceTrackClasses.MovieSceneFadeTrack > 0 and
            .sequenceTrackClasses.MovieSceneAudioTrack > 0 and
            .sequenceTrackClasses.MovieSceneEventTrack > 0 and
            .sequenceTrackClasses.MovieSceneParticleTrack > 0
          ' "$report" >/dev/null

          # The adapter is only valid in UE 4.27 and must not follow the
          # converted project into UE 5.5.4.
          used_plugin="$RUNNER_TEMP/ZenMatineeBridge-used"
          mv "$UE427_PROJECT_DIR/Plugins/ZenMatineeBridge" "$used_plugin"
          test ! -e "$UE427_PROJECT_DIR/Plugins/ZenMatineeBridge"

          du -sh "$UE427_PROJECT_DIR"
          df -hT / "$RUNNER_TEMP"

          maps_scanned="$(jq -r '.mapsScanned' "$report")"
          matinees_discovered="$(jq -r '.uniqueMatineesDiscovered' "$report")"
          target_map="$(jq -r '.targetMap' "$report")"
          target_actor="$(jq -r '.expectedActor' "$report")"
          warnings="$(jq -r '.conversionWarnings' "$report")"
          known_warnings="$(jq -r '.knownConversionWarnings' "$report")"
          unexpected_warnings="$(jq -r '.unexpectedConversionWarnings' "$report")"
          reference_contexts="$(jq '[.matineeInventory[].referenceContexts[]] | length' "$report")"
          referencers="$(jq '[.matineeInventory[].referenceContexts[].referencers[]] | length' "$report")"
          controller_nodes="$(jq '[.matineeInventory[].referenceContexts[].referencers[] | select(.class == "K2Node_MatineeController") | .objectPath] | unique | length' "$report")"
          literal_nodes="$(jq '[.matineeInventory[].referenceContexts[].referencers[] | select(.class == "K2Node_Literal") | .objectPath] | unique | length' "$report")"
          sequence="$(jq -r '.generatedSequences[0]' "$report")"
          {
            echo
            echo '## UE 4.27.2 bridge'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| Maps scanned | `%s` |\n' "$maps_scanned"
            printf '| Unique Matinee actors inventoried | `%s` |\n' "$matinees_discovered"
            printf '| Converted target | `%s:%s` |\n' "$target_map" "$target_actor"
            echo '| Matinee actors converted | `1` |'
            echo '| Source Matinee actors retained | `1` |'
            printf '| Generated sequence | `%s` |\n' "$sequence"
            printf '| Converter warnings (total / known / unexpected) | `%s / %s / %s` |\n' \
              "$warnings" "$known_warnings" "$unexpected_warnings"
            printf '| Matinee reference contexts / hard referencers | `%s / %s` |\n' \
              "$reference_contexts" "$referencers"
            printf '| Blueprint Matinee controllers / actor literals | `%s / %s` |\n' \
              "$controller_nodes" "$literal_nodes"
            echo '| Required source and Sequencer tracks | `verified` |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Replace UE 4.27 with the licensed UE 5.5.4 image
        if: ${{ inputs.run_ue_container }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          cleanup_login() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup_login EXIT

          docker image rm "$UE427_IMAGE"
          df -hT / "$RUNNER_TEMP"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin
          bash "$GITHUB_WORKSPACE/.github/scripts/pull-ghcr-image.sh" "$UE55_IMAGE"
          docker image inspect "$UE55_IMAGE" --format 'UE 5.5 image ID: {{.Id}} | Size: {{.Size}} bytes'

          build_version="$(docker run --rm --entrypoint /bin/cat "$UE55_IMAGE" \
            /home/ue4/UnrealEngine/Engine/Build/Build.version)"
          printf '%s\n' "$build_version" | jq --exit-status '
            .MajorVersion == 5 and
            .MinorVersion == 5 and
            .PatchVersion == 4
          ' >/dev/null || {
            echo '::error::The selected Epic image did not contain the required UE 5.5.4 engine.'
            printf '%s\n' "$build_version"
            exit 1
          }
          echo 'Verified Epic image engine version: 5.5.4'
          df -hT / "$RUNNER_TEMP"

      - name: Probe UE 5.5.4 with the project mounted read-only
        if: ${{ inputs.run_ue_container }}
        shell: bash
        run: |
          set -euo pipefail

          version_log="$RUNNER_TEMP/ue-version.log"
          set +e
          timeout 120s docker run --rm \
            --mount "type=bind,src=${UE427_PROJECT_DIR},dst=/workspace/EpicZenGarden,readonly" \
            "$UE55_IMAGE" \
            bash -lc '
              set -euo pipefail
              test -r /workspace/EpicZenGarden/EpicZenGarden.uproject
              echo "Verified that the project descriptor is readable."
              test -d /workspace/EpicZenGarden/Content
              echo "Verified that the project Content directory exists."
              if touch /workspace/EpicZenGarden/.write-probe 2>/dev/null; then
                echo "Project mount unexpectedly accepted a write." >&2
                exit 1
              fi
              echo "Verified that the read-only project mount rejected a write."

              runtime_dir=/tmp/ue-runtime
              mkdir -p "$runtime_dir"
              chmod 0700 "$runtime_dir"
              export XDG_RUNTIME_DIR="$runtime_dir"

              /home/ue4/UnrealEngine/Engine/Binaries/Linux/UnrealEditor \
                -unattended -NullRHI -NoSound -NoSplash -NoP4 \
                -ExecCmds=Quit -Seconds=60 \
                -stdout -FullStdOutLogOutput -UTF8Output
            ' > "$version_log" 2>&1
          probe_status="$?"
          set -e

          cat "$version_log"
          echo "UE 5.5.4 probe process status: $probe_status"

          if [[ "$probe_status" = 124 ]]; then
            echo '::error::The UE 5.5.4 container probe timed out.'
            exit 1
          fi
          if [[ "$probe_status" != 0 ]]; then
            echo '::error::The UE 5.5.4 container probe failed.'
            exit "$probe_status"
          fi

          required_probe_lines=(
            'Verified that the project descriptor is readable.'
            'Verified that the project Content directory exists.'
            'Verified that the read-only project mount rejected a write.'
            'LogInit: Engine Version: 5.5.4-37670630+UE5'
            "LogInit:  - we're running without rendering"
            'LogExit: Exiting.'
          )
          for required_line in "${required_probe_lines[@]}"; do
            if ! grep -Fq -- "$required_line" "$version_log"; then
              echo "::error::The UE 5.5.4 probe log is missing required success evidence: ${required_line}"
              exit 1
            fi
          done

          if grep -Eiq \
            'XDG_RUNTIME_DIR not set|Exiting abnormally|Fatal error|Critical error|Assertion failed|Unhandled Exception|Segmentation fault' \
            "$version_log"
          then
            echo '::error::The UE 5.5.4 probe log contains an environment, abnormal-exit, or fatal marker.'
            exit 1
          fi

          echo 'UE 5.5.4 started successfully and the Zen Garden project mount remained read-only.'

          {
            echo
            echo '## UE container probe'
            echo
            printf 'Validated `%s` against the UE 4.27 bridge output mounted read-only.\n' "$UE55_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
